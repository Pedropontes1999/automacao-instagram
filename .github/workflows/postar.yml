name: Postar video automatico

on:
  # O "schedule" nativo do GitHub tem um bug conhecido em repositorios privados novos
  # (nunca dispara). O agendamento real agora vem de um cron externo (cron-job.org)
  # chamando a API de workflow_dispatch nos horarios certos.
  workflow_dispatch: {}

concurrency:
  group: postar-instagram
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  postar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rodar postagem
        env:
          PAGE_TOKEN: ${{ secrets.PAGE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node postar.js

      - name: Salvar estado atualizado
        run: |
          git config user.name "automacao-instagram"
          git config user.email "automacao@users.noreply.github.com"
          git add -f estado.json postar.log
          git diff --cached --quiet || git commit -m "Atualiza estado da automacao"
          for i in 1 2 3 4 5; do
            git push && break
            echo "push rejeitado, tentando de novo (tentativa $i)..."
            git pull --rebase origin main
            sleep 3
          done
